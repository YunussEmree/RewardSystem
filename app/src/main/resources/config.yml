      - "&7☣ Player &a%killer% &7slayed a &2Rotting Zombie &7☣"
      - "&8» &aDamage Leaderboard:"
      - "&e1st &8❙ &6%top_name_1% &8(&c%top_damage_1%&8)"
      - "&72nd &8❙ &f%top_name_2% &8(&c%top_damage_2%&8)"
