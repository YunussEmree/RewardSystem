# RewardSystem Config.yml
# Basic Settings
Debug:
  enabled: true  # Enables/disables debug mode
  # Debug Levels Explanation:
  # DEBUG: Most detailed log level. Shows all messages and is useful for troubleshooting.
  #        Logs all operations, reward calculations, and results of mathematical expressions.
  #        Use only when troubleshooting as it may impact performance during normal operation.
  #        Recommended when reporting issues. 
  #
  # INFO: Standard log level. Shows important operations and statuses.
  #       Provides information about reward distributions, mathematical calculation results,
  #       and important events. 
  #
  # WARNING: Shows only warnings and errors.
  #          Logs errors in mathematical expressions, invalid commands, and potential issues.
  #          Use to filter out unnecessary information. Recommended for general use.
  #
  # SEVERE: Shows only serious errors.
  #         Provides information about database connection errors, critical operation failures,
  #         and issues that prevent the plugin from functioning properly.
  #         Use when minimal logging information is desired.
  level: WARNING    # Available levels: DEBUG, INFO, WARNING, SEVERE

# Database Settings
Database:
  type: sqlite    # Can use 'sqlite' or 'mysql'
  # These settings are required for MySQL (when type: mysql)
  host: localhost
  port: 3306
  database: rewardsystem
  username: root
  password: password
  table-prefix: rs_

# Performance Settings
ThrottleInterval: 500     # Throttling in milliseconds for high-frequency mob deaths
TrackAllMobs: false       # Whether to track all mobs' damage (affects performance)
MinimumDamageRequirement: 5.0  # Global minimum damage requirement

##Extra Placeholders
#
#  %player% - Player Name
#  %killer% - Killer Name

#  %personal_damage% / %damage% - Personal Damage
#  %top_name_1% - Top Name 1
#  %top_damage_1% - Top Damage 1
#  %top_name_2% - Top Name 2
#  %top_damage_2% - Top Damage 2
#  %top_name_3% - Top Name 3
#  %top_damage_3% - Top Damage 3
#  ... continue for more top players
#
#  %time% - Cooldown Time
#
#  %entity% - Killed Entity Type
#  %world% - Killed Entity World
#  %position% - Killed Entity Position


# Example Reward Configurations
Rewards:
  zombie:
    id: zombie_reward         # Unique ID for the reward. Every id must be unique. (required)
    type: "ZOMBIE"              # The entity type to match (required).  "" -> no check
    name: "Rotting Zombie"    # Custom name to match (required). "" -> no check
    enabledWorld: "world"     # World to enable rewards in (required). "" -> no check
    enabledRegion: ""         # Region to enable rewards in (required). "" -> no check
    minimumDamage: 10.0       # Minimum damage required to trigger rewards (optional)
    minimumDamagePercent: 5.0 # Minimum damage percentage required to trigger rewards (optional)
    radius: 50                # Radius of the text message, set to -1 to infinite
    cooldown: 60              # Cooldown time (optional)
    cooldownType: MINUTES     # Cooldown type (DAYS, HOURS, MINUTES, SECONDS,)
    cooldownMessage: "&cYou need to wait %time% before getting rewards from this zombie again!" # Cooldown message (optional)

    allRewards: # Rewards for all players / participant rewards
      - "give %player% minecraft:coal 5"
      - "title %player% title {\"text\":\"Zombie Slain!\",\"color\":\"green\"}" # Simple chance reward (50% chance)
      - "give %player% minecraft:diamond 1 50.0%"
      - "give %player% minecraft:emerald 2 {math:20 + (%player_level% / 10)}%" # Math expression-based chance (20% + level/10)

    rewards: # Rewards for specific player ranks
      1:
        - "give %player% minecraft:diamond 3"
        - "give %player% minecraft:golden_apple 1"
        - "give %player% minecraft:netherite_ingot 1 {math:max(10, 90 - (%player_level% * 10))}%" # Math chance example: 90% chance minus 10% per level, minimum 10%
      2:
        - "give %player% minecraft:iron_ingot 5"
        - "give %player% minecraft:diamond 1 25.0%" # Simple chance reward (25% chance)
      3:
        - "give %player% minecraft:iron_ingot 2"

    lastHitRewards: # Rewards for killer player
      - "give %player% minecraft:experience_bottle 5"
      - "effect give %player% minecraft:regeneration 10 1"
      - "give %player% minecraft:diamond 3 {math:%player_level% * 5}%" # Last-hit bonus with math chance (level*5 percent)

    rewardMessages: # Reward messages when mob is killed
